spring.application.name=rest-api

# H2 Database configuration
spring.datasource.url=jdbc:h2:mem:testdb  # In-memory database
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password_
spring.datasource.platform=h2

# Hibernate JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Enable devtools for hot reload
spring.devtools.restart.enabled=true

# Flyway configuration for DB migrations (optional)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db.migration

# Enable H2 console for easier database access (optional)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

api.security.token.secret = {JWT_SECRET:my-secret-key}

# Google OAuth2 configuration
spring.security.oauth2.client.registration.google.client-id=18872988524-mpahk09584btd5irks0clgi3vh7e245k.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=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
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://openidconnect.googleapis.com/v1/userinfo
spring.security.oauth2.client.provider.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs
spring.security.oauth2.client.provider.google.user-name-attribute=sub
